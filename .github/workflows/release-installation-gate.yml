name: Release Installation gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-installation-gate.yml"
      - "README.md"
      - "docs/release-installation.md"
      - "docs/releases/**"
      - "install.sh"
      - "package*.json"
      - "release/**"
      - "scripts/install.mjs"
      - "scripts/release-installation-gate.mjs"
      - "src/**"
      - "test/support/**"
      - "upstream/**"

permissions:
  contents: read

concurrency:
  group: release-installation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  packed-release:
    name: Packed release / ${{ matrix.os }} / Stock Pi ${{ matrix.stock_pi }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
        stock_pi: [absent, present]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install development dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Execute packed Release Installation journey
        shell: bash
        run: |
          args=(--journey=packed-release --stock-pi=${{ matrix.stock_pi }})
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args+=(--require-tag); fi
          npm run test:release-installation -- "${args[@]}"
      - name: Upload exact tested tarball, durable packed-release report, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-installation-packed-${{ runner.os }}-${{ runner.arch }}-stock-${{ matrix.stock_pi }}
          path: artifacts/acceptance/release-installation/packed-release-*/
          if-no-files-found: error
          retention-days: 90

  source-parity:
    name: Exact-source parity / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install development dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Compare the exact-source and packed entrances
        shell: bash
        run: |
          args=(--journey=source-parity)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args+=(--require-tag); fi
          npm run test:release-installation -- "${args[@]}"
      - name: Upload exact tested tarball, durable source-parity report, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-installation-source-parity-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/acceptance/release-installation/source-parity-*/
          if-no-files-found: error
          retention-days: 90
